            align-items: center;

        }

        .pref-count { font-size: 0.9rem; color: var(--primary); background: rgba(212, 163, 115, 0.1); padding: 4px 12px; border-radius: 20px; margin-left: 10px; }

        .pref-section.active .onsen-list { display: block; }
        .pref-section.active .fa-chevron-down { transform: rotate(180deg); transition: 0.3s; }

        .onsen-item {
            padding: 15px 25px;
            border-bottom: 1px solid #333;
            display: grid;
            grid-template-columns: 1.5fr 1.2fr 80px;
            gap: 15px;
            align-items: center;
        }
        .onsen-item:hover { background: #2d2d2d; }
        .onsen-item:last-child { border-bottom: none; }

        .onsen-rating { color: #ffcc00; text-align: right; font-size: 1.2rem; }

            .onsen-rating { text-align: left; }

</head>

    function renderList(data) {
        const container = document.getElementById('accordionContainer');
        container.innerHTML = '';
        
        const grouped = data.reduce((acc, obj) => {
            const key = obj.pref || '未分類';
            if (!acc[key]) acc[key] = [];
            acc[key].push(obj);
            return acc;
        }, {});

        const prefOrder = [
            "北海道", "青森県", "岩手県", "宮城県", "秋田県", "山形県", "福島県",
            "茨城県", "栃木県", "群馬県", "埼玉県", "千葉県", "東京都", "神奈川県",
            "新潟県", "富山県", "石川県", "福井県", "山梨県", "長野県", "岐阜県",
            "静岡県", "愛知県", "三重県", "滋賀県", "京都府", "大阪府", "兵庫県",
            "奈良県", "和歌山県", "鳥取県", "島根県", "岡山県", "広島県", "山口県",
            "徳島県", "香川県", "愛媛県", "高知県", "福岡県", "佐賀県", "長崎県",
            "熊本県", "大分県", "宮崎県", "鹿児島県", "沖縄県"
        ];

        const sortedPrefs = Object.keys(grouped).sort((a, b) => {
            const idxA = prefOrder.indexOf(a);
            const idxB = prefOrder.indexOf(b);
            return (idxA > -1 ? idxA : 99) - (idxB > -1 ? idxB : 99);
        });

        document.getElementById('prefCount').innerText = sortedPrefs.length;

        sortedPrefs.forEach(pref => {
            const section = document.createElement('div');
            section.className = 'pref-section';
            const onsens = grouped[pref].sort((a, b) => (a.area || '').localeCompare(b.area || '', 'ja'));
            
            section.innerHTML = `
                <div class="pref-header" onclick="this.parentElement.classList.toggle('active')">
                    <div>
                        <span class="pref-name">${pref}</span>
                        <span class="pref-count">${onsens.length} 件</span>
                    </div>
                    <i class="fas fa-chevron-down"></i>
                </div>
                <div class="onsen-list">
                    ${onsens.map(o => `
                        <div class="onsen-item">
                            <div class="onsen-main">
                                <span class="onsen-name">${o.name}</span>
                                <span class="onsen-area"><i class="fas fa-map-marker-alt"></i> ${o.area || '-'}</span>
                            </div>
                            <div class="onsen-type">${o.type || '-'}</div>
                            <div class="onsen-rating">${o.rating || ''}</div>
                        </div>
                    `).join('')}
                </div>
            `;
            container.appendChild(section);
        });
    }

    renderList(onsenData);

    document.getElementById('searchInput').addEventListener('input', (e) => {
        const term = e.target.value.toLowerCase();
        const filtered = onsenData.filter(item => 
            item.name.toLowerCase().includes(term) || 
            item.pref.toLowerCase().includes(term) ||
            (item.type && item.type.toLowerCase().includes(term)) ||
            (item.area && item.area.toLowerCase().includes(term))
        );
        renderList(filtered);
        document.getElementById('totalCount').innerText = filtered.length;
        if(term !== "") {
            document.querySelectorAll('.pref-section').forEach(s => s.classList.add('active'));
        }
    });
</script>
